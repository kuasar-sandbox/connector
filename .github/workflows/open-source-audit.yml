name: Open Source Audit

on:
  pull_request:
    paths:
      - .github/workflows/open-source-audit.yml

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out complete reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history and GitHub records
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import io
          import json
          import os
          import re
          import subprocess
          import sys
          import tarfile
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = os.environ["REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          OWNER, NAME = REPO.split("/", 1)
          API = "https://api.github.com"
          MAX_TEXT_BLOB = 16 * 1024 * 1024
          MAX_ARCHIVE_MEMBER = 16 * 1024 * 1024
          MAX_ACTION_ARCHIVE_BYTES = 2 * 1024 * 1024 * 1024
          MAX_RELEASE_BYTES = 1024 * 1024 * 1024

          hard_rules = [
              ("private-key", re.compile(rb"-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----")),
              ("aws-access-key", re.compile(rb"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b")),
              ("github-token", re.compile(rb"\bgh[pousr]_[A-Za-z0-9]{20,}\b")),
              ("slack-token", re.compile(rb"\bxox[baprs]-[A-Za-z0-9-]{10,}\b")),
              ("google-api-key", re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("basic-auth-url", re.compile(rb"https?://[^/\s:@]+:[^@\s/]+@")),
          ]
          review_rules = [
              ("generic-secret-assignment", re.compile(
                  rb"(?i)\b(?:password|passwd|api[_-]?key|access[_-]?key|secret|token|client[_-]?secret|private[_-]?key)\b"
                  rb"[^\r\n]{0,32}[:=][ \t]*[\"']?[A-Za-z0-9+/=_-]{12,}"
              )),
              ("private-ip", re.compile(
                  rb"(?<![0-9])(?:10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}|192\.168\.(?:[0-9]{1,3}\.)[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.(?:[0-9]{1,3}\.)[0-9]{1,3})(?![0-9])"
              )),
              ("internal-domain", re.compile(rb"(?i)\b[a-z0-9][a-z0-9.-]*\.(?:corp|internal|intranet|lan)\b")),
          ]
          suspicious_path = re.compile(
              r"(?i)(^|/)(?:\.env(?:\.|$)|credentials?(?:\.|$)|secrets?(?:\.|$)|id_(?:rsa|dsa|ecdsa|ed25519)(?:\.|$)|[^/]+\.(?:p12|pfx|jks|kubeconfig|key))"
          )

          findings = []
          review = []
          coverage = []

          def line_number(data, offset):
              return data.count(b"\n", 0, offset) + 1

          def add_matches(data, location, source, hard=True):
              target = findings if hard else review
              rules = hard_rules if hard else review_rules
              for rule, pattern in rules:
                  for match in pattern.finditer(data):
                      target.append({
                          "source": source,
                          "location": location,
                          "rule": rule,
                          "line": line_number(data, match.start()),
                      })

          def scan_bytes(data, location, source):
              add_matches(data, location, source, hard=True)
              if b"\x00" not in data[:8192]:
                  add_matches(data, location, source, hard=False)

          def run(*args, input_text=None):
              return subprocess.run(
                  args,
                  input=input_text,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True,
              ).stdout

          # Scan every unique blob reachable from fetched branches/tags. No matched value is printed.
          object_lines = run("git", "rev-list", "--objects", "--all").splitlines()
          oid_paths = collections.defaultdict(list)
          for item in object_lines:
              oid, _, path = item.partition(" ")
              if path:
                  oid_paths[oid].append(path)
              else:
                  oid_paths.setdefault(oid, [])
          batch_input = "\n".join(object_lines) + "\n"
          batch = run(
              "git", "cat-file",
              "--batch-check=%(objectname) %(objecttype) %(objectsize) %(rest)",
              input_text=batch_input,
          ).splitlines()
          unique_blobs = {}
          for row in batch:
              parts = row.split(" ", 3)
              if len(parts) < 3:
                  continue
              oid, kind, size_text = parts[:3]
              if kind == "blob":
                  unique_blobs[oid] = int(size_text)

          oversized = []
          suspicious_paths = set()
          for oid, size in unique_blobs.items():
              paths = sorted(set(oid_paths.get(oid, [])))
              shown = paths[:3] or ["<unknown-path>"]
              for path in paths:
                  if suspicious_path.search(path):
                      suspicious_paths.add(path)
              if size > MAX_TEXT_BLOB:
                  oversized.append((size, shown))
                  continue
              data = subprocess.check_output(["git", "cat-file", "blob", oid])
              scan_bytes(data, f"{shown[0]}@{oid[:12]}", "git-blob")

          coverage.append(f"reachable git objects: {len(oid_paths)}; unique blobs scanned: {len(unique_blobs) - len(oversized)}; oversized blobs listed: {len(oversized)}")

          # Commit metadata and messages become public with history.
          emails = run("git", "log", "--all", "--format=%ae%n%ce").splitlines()
          email_domains = collections.Counter()
          for value in emails:
              if "@" in value:
                  email_domains[value.rsplit("@", 1)[1].lower()] += 1
          messages = run("git", "log", "--all", "--format=%H%x00%B%x00").split("\x00")
          message_hits = []
          sensitive_message = re.compile(r"(?i)\b(?:password|credential|customer|client secret|private key|internal endpoint|production token)\b")
          for index in range(0, len(messages) - 1, 2):
              sha, body = messages[index], messages[index + 1]
              terms = sorted({m.group(0).lower() for m in sensitive_message.finditer(body)})
              if terms:
                  message_hits.append((sha[:12], terms))

          def request_json(path_or_url, method="GET", payload=None, accept="application/vnd.github+json"):
              url = path_or_url if path_or_url.startswith("http") else API + path_or_url
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Accept", accept)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response), response.headers

          def paginate(path):
              page = 1
              while True:
                  sep = "&" if "?" in path else "?"
                  data, _ = request_json(f"{path}{sep}per_page=100&page={page}")
                  if isinstance(data, dict):
                      items = data.get("artifacts") or data.get("workflow_runs") or []
                  else:
                      items = data
                  if not items:
                      break
                  for item in items:
                      yield item
                  if len(items) < 100:
                      break
                  page += 1

          def scan_text(value, location, source):
              if value:
                  scan_bytes(value.encode("utf-8", "replace"), location, source)

          # Issue/PR bodies and all repository-wide issue, review, and commit comments.
          issue_count = 0
          for item in paginate(f"/repos/{REPO}/issues?state=all&direction=asc"):
              issue_count += 1
              kind = "pr" if "pull_request" in item else "issue"
              scan_text(item.get("title"), f"{kind}#{item['number']}:title", "github-record")
              scan_text(item.get("body"), f"{kind}#{item['number']}:body", "github-record")
          record_counts = {}
          for label, path in [
              ("issue-comments", f"/repos/{REPO}/issues/comments?direction=asc"),
              ("review-comments", f"/repos/{REPO}/pulls/comments?direction=asc"),
              ("commit-comments", f"/repos/{REPO}/comments?direction=asc"),
          ]:
              count = 0
              for item in paginate(path):
                  count += 1
                  scan_text(item.get("body"), f"{label}:{item.get('id')}", "github-record")
              record_counts[label] = count

          # Review submission bodies via GraphQL, including pagination.
          review_body_count = 0
          cursor = None
          while True:
              query = """
              query($owner:String!, $name:String!, $after:String) {
                repository(owner:$owner, name:$name) {
                  pullRequests(first:50, after:$after, orderBy:{field:CREATED_AT,direction:ASC}) {
                    nodes { number reviews(first:100) { nodes { databaseId body } } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
              """
              payload = {"query": query, "variables": {"owner": OWNER, "name": NAME, "after": cursor}}
              result, _ = request_json("https://api.github.com/graphql", method="POST", payload=payload)
              if result.get("errors"):
                  coverage.append("review submission scan: GraphQL returned errors")
                  break
              pulls = result["data"]["repository"]["pullRequests"]
              for pr in pulls["nodes"]:
                  for review_item in pr["reviews"]["nodes"]:
                      review_body_count += 1
                      scan_text(review_item.get("body"), f"pr#{pr['number']}:review:{review_item.get('databaseId')}", "github-record")
              if not pulls["pageInfo"]["hasNextPage"]:
                  break
              cursor = pulls["pageInfo"]["endCursor"]

          # Release notes and asset names. Archive content is sampled below.
          releases = list(paginate(f"/repos/{REPO}/releases"))
          for release in releases:
              tag = release.get("tag_name") or "<untagged>"
              scan_text(release.get("name"), f"release:{tag}:name", "github-record")
              scan_text(release.get("body"), f"release:{tag}:body", "github-record")
              for asset in release.get("assets", []):
                  scan_text(asset.get("name"), f"release:{tag}:asset:{asset.get('id')}", "github-record")
          coverage.append(
              f"GitHub records: {issue_count} issues/PRs, {record_counts.get('issue-comments', 0)} issue comments, "
              f"{record_counts.get('review-comments', 0)} review comments, {review_body_count} review submissions, "
              f"{record_counts.get('commit-comments', 0)} commit comments, {len(releases)} releases"
          )

          # Inventory Actions artifacts. Their names are scanned and content is flagged for explicit review.
          artifacts = list(paginate(f"/repos/{REPO}/actions/artifacts"))
          live_artifacts = [a for a in artifacts if not a.get("expired")]
          for artifact in artifacts:
              scan_text(artifact.get("name"), f"actions-artifact:{artifact.get('id')}", "github-record")
          coverage.append(f"Actions artifacts inventoried: {len(artifacts)} total, {len(live_artifacts)} non-expired")

          # Scan available recent Actions log archives within a bounded byte budget.
          def download_to_temp(url, accept="application/vnd.github+json"):
              req = urllib.request.Request(url)
              req.add_header("Accept", accept)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              tmp = tempfile.NamedTemporaryFile(delete=False)
              total = 0
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          total += len(chunk)
                          tmp.write(chunk)
                  tmp.close()
                  return tmp.name, total
              except Exception:
                  tmp.close()
                  os.unlink(tmp.name)
                  raise

          def scan_zip(path, source_prefix):
              with zipfile.ZipFile(path) as zf:
                  for info in zf.infolist():
                      if info.is_dir() or info.file_size > MAX_ARCHIVE_MEMBER:
                          continue
                      with zf.open(info) as member:
                          data = member.read(MAX_ARCHIVE_MEMBER + 1)
                      if len(data) <= MAX_ARCHIVE_MEMBER:
                          scan_bytes(data, f"{source_prefix}:{info.filename}", "archive")

          run_items = list(paginate(f"/repos/{REPO}/actions/runs?exclude_pull_requests=false"))
          log_bytes = 0
          log_runs_scanned = 0
          log_runs_skipped = 0
          for run_item in run_items:
              if log_bytes >= MAX_ACTION_ARCHIVE_BYTES:
                  log_runs_skipped += 1
                  continue
              try:
                  path, size = download_to_temp(run_item["logs_url"])
                  try:
                      if log_bytes + size > MAX_ACTION_ARCHIVE_BYTES:
                          log_runs_skipped += 1
                      else:
                          scan_zip(path, f"actions-run:{run_item['id']}")
                          log_bytes += size
                          log_runs_scanned += 1
                  finally:
                      os.unlink(path)
              except urllib.error.HTTPError as error:
                  if error.code not in (404, 410):
                      coverage.append(f"Actions log scan error for run {run_item.get('id')}: HTTP {error.code}")
                  log_runs_skipped += 1
              except Exception as error:
                  coverage.append(f"Actions log scan error for run {run_item.get('id')}: {type(error).__name__}")
                  log_runs_skipped += 1
          coverage.append(
              f"Actions logs: {log_runs_scanned}/{len(run_items)} run archives scanned, "
              f"{log_bytes} compressed bytes, {log_runs_skipped} unavailable or budget-skipped"
          )

          # Inspect latest stable and latest preview release archives within a bounded budget.
          selected = []
          stable = next((r for r in releases if not r.get("draft") and not r.get("prerelease")), None)
          preview = next((r for r in releases if not r.get("draft") and r.get("prerelease")), None)
          for item in (stable, preview):
              if item and item not in selected:
                  selected.append(item)
          release_bytes = 0
          release_assets_scanned = 0
          release_assets_skipped = 0
          for release in selected:
              tag = release.get("tag_name") or "<untagged>"
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  if not (name.endswith(".tar.gz") or name.endswith(".zip") or name == "SHA256SUMS"):
                      continue
                  if release_bytes + int(asset.get("size") or 0) > MAX_RELEASE_BYTES:
                      release_assets_skipped += 1
                      continue
                  try:
                      path, size = download_to_temp(asset["url"], accept="application/octet-stream")
                      try:
                          release_bytes += size
                          if name.endswith(".zip"):
                              scan_zip(path, f"release:{tag}:{name}")
                          elif name.endswith(".tar.gz"):
                              with tarfile.open(path, "r:gz") as tf:
                                  for member in tf:
                                      if not member.isfile() or member.size > MAX_ARCHIVE_MEMBER:
                                          continue
                                      stream = tf.extractfile(member)
                                      if stream is None:
                                          continue
                                      data = stream.read(MAX_ARCHIVE_MEMBER + 1)
                                      if len(data) <= MAX_ARCHIVE_MEMBER:
                                          scan_bytes(data, f"release:{tag}:{name}:{member.name}", "archive")
                          else:
                              with open(path, "rb") as fh:
                                  scan_bytes(fh.read(MAX_ARCHIVE_MEMBER + 1), f"release:{tag}:{name}", "archive")
                          release_assets_scanned += 1
                      finally:
                          os.unlink(path)
                  except Exception as error:
                      coverage.append(f"release asset scan error {tag}/{name}: {type(error).__name__}")
                      release_assets_skipped += 1
          coverage.append(
              f"release archive sample: {release_assets_scanned} assets scanned from latest stable/preview, "
              f"{release_bytes} bytes, {release_assets_skipped} skipped"
          )

          # Deduplicate sanitized findings without exposing matched values.
          def dedupe(items):
              seen = set()
              result = []
              for item in items:
                  key = (item["source"], item["location"], item["rule"], item["line"])
                  if key not in seen:
                      seen.add(key)
                      result.append(item)
              return result

          findings = dedupe(findings)
          review = dedupe(review)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              f"# Open-source audit: `{REPO}`",
              "",
              "The scanner reports rule names and locations only; matched values are intentionally redacted.",
              "",
              "## Coverage",
          ]
          lines.extend(f"- {item}" for item in coverage)
          lines.extend([
              "",
              f"## High-confidence credential candidates ({len(findings)})",
          ])
          if findings:
              lines.append("| Source | Location | Rule | Line |")
              lines.append("| --- | --- | --- | ---: |")
              for item in findings[:500]:
                  lines.append(f"| {item['source']} | `{item['location']}` | {item['rule']} | {item['line']} |")
          else:
              lines.append("No high-confidence credential pattern was detected in the scanned coverage.")

          lines.extend([
              "",
              f"## Manual-review candidates ({len(review)})",
          ])
          if review:
              lines.append("| Source | Location | Rule | Line |")
              lines.append("| --- | --- | --- | ---: |")
              for item in review[:500]:
                  lines.append(f"| {item['source']} | `{item['location']}` | {item['rule']} | {item['line']} |")
              if len(review) > 500:
                  lines.append(f"Only the first 500 of {len(review)} review candidates are shown.")
          else:
              lines.append("No generic secret assignment, private IP, or internal-domain pattern was detected.")

          lines.extend(["", f"## Suspicious historical paths ({len(suspicious_paths)})"])
          if suspicious_paths:
              lines.extend(f"- `{path}`" for path in sorted(suspicious_paths)[:500])
          else:
              lines.append("None detected.")

          lines.extend(["", f"## Oversized historical blobs ({len(oversized)})"])
          if oversized:
              for size, paths in sorted(oversized, reverse=True)[:200]:
                  lines.append(f"- {size} bytes: `{paths[0]}`")
          else:
              lines.append("None exceeded the text scan limit.")

          lines.extend(["", "## Commit email domains"])
          for domain, count in sorted(email_domains.items()):
              lines.append(f"- `{domain}`: {count}")

          lines.extend(["", f"## Commit-message review candidates ({len(message_hits)})"])
          if message_hits:
              for sha, terms in message_hits[:200]:
                  lines.append(f"- `{sha}`: {', '.join(terms)}")
          else:
              lines.append("None detected.")

          lines.extend([
              "",
              "## Interpretation",
              "- Every high-confidence candidate requires manual inspection and credential revocation if genuine.",
              "- Manual-review candidates may be documentation, tests, reserved addresses, or placeholders; they are not findings by themselves.",
              "- Non-expired Actions artifacts are inventoried, but only available log archives and selected release archives are content-scanned within the stated byte budgets.",
          ])
          rendered = "\n".join(lines) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write(rendered)
          print(rendered)
          PY
