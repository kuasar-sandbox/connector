name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Component version in vX.Y.Z or vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Release must run from main" >&2; exit 1; }
          bash scripts/publish-release.sh check "$VERSION" "$TARGET_ARCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: [self-hosted, Linux, X64, kuasar-e2e]
    timeout-minutes: 45
    env:
      TARGET_ARCH: x86_64
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
    steps:
      - name: Check out exact component source
        id: checkout-source
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retry exact component source checkout
        if: steps.checkout-source.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attach native source cache
        run: |
          set -euo pipefail
          install -d -m 0755 /var/cache/kuasar/tarballs
          mkdir -p build
          ln -sfn /var/cache/kuasar/tarballs build/tarball

      - name: Build and test connector
        run: |
          set -euo pipefail
          make test
          make vet
          make build

      - name: Package the component release
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          bash scripts/release.sh package "$VERSION" "$TARGET_ARCH" release-bundle

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    concurrency:
      group: component-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: component-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish component release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh publish \
            "$VERSION" "$TARGET_ARCH" "$GITHUB_SHA" release-bundle
