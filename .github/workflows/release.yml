name: Release
run-name: ${{ github.event_name == 'schedule' && 'Daily v0.1.0 preview' || format('Release {0}', inputs.version) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Component version in vX.Y.Z or vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string
  schedule:
    - cron: "12 2 * * *"
      timezone: Asia/Shanghai
    - cron: "12 4 * * *"
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Release must run from main" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" >/dev/null 2>&1; then
              echo "version=v0.1.0" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            VERSION="v0.1.0-preview.$(TZ=Asia/Shanghai date -d "$created_at" +%Y%m%d)"
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" > existing.json 2>/dev/null; then
              jq -e --arg version "$VERSION" \
                '.tag_name == $version and .draft == false and .prerelease == true' \
                existing.json >/dev/null
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            VERSION="$INPUT_VERSION"
          fi
          bash scripts/publish-release.sh check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
    steps:
      - name: Check out exact component source
        id: checkout-source
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retry exact component source checkout
        if: steps.checkout-source.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attach native source cache
        run: |
          set -euo pipefail
          install -d -m 0755 /var/cache/kuasar/tarballs
          mkdir -p build
          ln -sfn /var/cache/kuasar/tarballs build/tarball

      - name: Build and test connector
        run: |
          set -euo pipefail
          make test
          make vet
          make build

      - name: Package the component release
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf 'repository\trequested_ref\tresolved_sha\trole\n' > revisions.tsv
          printf '%s\t%s\t%s\t%s\n' \
            "$GITHUB_REPOSITORY" main "$GITHUB_SHA" primary >> revisions.tsv
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          bash scripts/release.sh package "$VERSION" "$TARGET_ARCH" revisions.tsv release-bundle

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: component-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish component release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh publish release-bundle
