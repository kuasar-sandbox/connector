# connector configuration — install to /etc/connector/switch.conf
# (read by connector-vswitch.service, consumed by connector-ctl vswitch via env vars).
# See `connector-ctl vswitch serve --help` for flags.

SWITCH_NAME=sw0
SWITCH_NETNS=sw0_vswitch

# Management netns. Leave empty (MGMT_NETNS=) to keep the mgmt veth peer in
# the caller netns (typically the host/root netns) — useful when the mgmt /
# metadata service runs directly on the host without a dedicated netns.
MGMT_NETNS=

PORT_MODE=tap
PORTS=4096
PORT_NETNS=

# Virtual MAC and floating IP
MAC_ADDR=02:00:00:00:00:01
FLOATING_IP_BASE=100.100.96.0

# Transit device
TRANSIT_DEV=
TRANSIT_DEV_ADDR=auto
TRANSIT_DEV_MTU=auto

# Management plane extraction matches. These CIDRs are passed only to
# --mgmt-extract and are not assigned to the management interface.
MGMT_EXTRACT_CIDRS=169.254.169.254/32

# Comma-separated management interface addresses configured idempotently by
# connector-vswitch.service. Leave empty for an addressless extraction peer.
MGMT_ADDRS=169.254.169.254/32
