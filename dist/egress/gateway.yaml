name: local
runtime_dir: /var/lib/connector-egress/egress-local
vpp: /opt/connector/bin/vpp
plugin_path: /opt/connector/bin/lib/x86_64-linux-gnu/vpp_plugins
library_path: /opt/connector/bin/lib/x86_64-linux-gnu
interfaces:
- name: egress-rx
  address: 198.18.0.1/24
  mtu: 9000
- name: egress-uplink
  address: 192.0.2.1/24
  mtu: 1500
attachments:
- name: sw0
  interface: egress-rx
  peer: 198.18.0.2
  locator: port
  inner_mtu: 1500
area_files:
- area7.yaml
heap_size: 4G
timeouts:
  udp: 300
  tcp_transitory: 240
  tcp_established: 7440
  icmp: 60
context_idle_seconds: 1
stats_size: 1G
