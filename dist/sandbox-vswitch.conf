# sandbox-vswitch configuration — install to /etc/sandbox-vswitch/switch.conf
# (read by sandbox-vswitch.service, consumed by vswitch-ctl via env vars).
# See `vswitch-ctl serve --help` for flags.

SWITCH_NAME=sw0
SWITCH_NETNS=sw0_vswitch

# Management netns. Leave empty (MGMT_NETNS=) to keep the mgmt veth peer in
# the caller netns (typically the host/root netns) — useful when the mgmt /
# metadata service runs directly on the host without a dedicated netns.
MGMT_NETNS=
MGMT_DEV=${SWITCH_NAME}_mgmt

PORT_MODE=tap
PORTS=4096
PORT_NETNS=

# Virtual MAC and floating IP
MAC_ADDR=02:00:00:00:00:01
FLOATING_IP_BASE=100.100.96.0

# Transit device
TRANSIT_DEV=
TRANSIT_DEV_ADDR=auto
TRANSIT_DEV_MTU=auto

# Management plane
MGMT_SERVICE_ROUTES=169.254.169.254/32
